# Mosquitto ACL — device_id matched against username set at CONNECT time

# Backend service: full read/write on home/# and analytics/#
user backend
topic readwrite home/#
topic readwrite analytics/#
topic readwrite home/gateway/#

# Per-device rules: each device may only publish to its own topics
# and subscribe to its own command topics
# Pattern %u is replaced with the connecting client's username
pattern write home/%u/telemetry
pattern write home/%u/status
pattern write home/%u/alert
pattern read  home/%u/cmd/#

# Admin user: full access (used for debugging and provisioning)
user admin
topic readwrite #
