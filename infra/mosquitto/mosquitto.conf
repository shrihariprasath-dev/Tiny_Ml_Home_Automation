# ── Eclipse Mosquitto 2.0 Configuration ─────────────────────────────────────

# Persistence
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all

# ── Plain MQTT listener (LAN only — for ESP32 on trusted network) ────────────
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ── MQTT over TLS 1.2 (port 8883) ───────────────────────────────────────────
listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false    # client certs optional; authenticated by password+ACL
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ── Connection tuning ────────────────────────────────────────────────────────
max_keepalive 120
max_connections 500
message_size_limit 65536
