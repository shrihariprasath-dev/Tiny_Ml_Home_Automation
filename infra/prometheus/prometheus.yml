global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "smarthome_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "smarthome_ai_service"
    static_configs:
      - targets: ["ai_service:8001"]
    metrics_path: /metrics

  - job_name: "influxdb"
    static_configs:
      - targets: ["influxdb:8086"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "mosquitto"
    static_configs:
      - targets: ["mosquitto:9090"]
    metrics_path: /metrics
