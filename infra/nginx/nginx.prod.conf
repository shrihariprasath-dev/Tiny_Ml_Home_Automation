# nginx.prod.conf — Production Nginx configuration
# Differences from nginx.conf:
#   - SSL certs from Let's Encrypt (certbot) paths
#   - OCSP stapling enabled
#   - Worker tuning for production load
#   - Gzip compression enabled
#   - Frontend container proxied at /

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Rate limiting — 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    # Upstream services (private Docker network)
    upstream api        { server api:8000;        keepalive 32; }
    upstream frontend   { server frontend:3000;   keepalive 16; }
    upstream grafana    { server grafana:3000;     keepalive 8;  }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — Main server ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # Let's Encrypt certificate paths (certbot)
        ssl_certificate     /etc/letsencrypt/live/smarthome/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smarthome/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/smarthome/chain.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            DENY                always;
        add_header X-Content-Type-Options     nosniff             always;
        add_header X-XSS-Protection           "1; mode=block"     always;
        add_header Referrer-Policy            "strict-origin"     always;
        add_header Permissions-Policy         "geolocation=()"    always;

        # Buffer tuning
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        client_max_body_size       50M;

        # ── Next.js frontend ────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── FastAPI ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass       http://api;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ota/ {
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 100M;
        }

        location /health  { proxy_pass http://api; access_log off; }
        location /docs    { proxy_pass http://api; }
        location /redoc   { proxy_pass http://api; }
        location /openapi.json { proxy_pass http://api; }

        location /metrics {
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            deny  all;
            proxy_pass http://api;
        }

        # ── WebSocket (real-time dashboard) ─────────────────────────────────
        location /ws/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Grafana ─────────────────────────────────────────────────────────
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
