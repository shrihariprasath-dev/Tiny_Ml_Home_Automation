name: smarthome_app
description: Smart Home Power Management Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # MQTT
  mqtt_client: ^10.2.1

  # Local storage / offline cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Push notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4

  # Charts
  fl_chart: ^0.68.0

  # QR code
  mobile_scanner: ^5.1.0

  # Auth / secure storage
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1

  # UI utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.6.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
