name: Backend CI / Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infra/docker-compose*.yml'
      - '.github/workflows/backend_deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_API:        ghcr.io/${{ github.repository_owner }}/smarthome-api
  IMAGE_AI_SERVICE: ghcr.io/${{ github.repository_owner }}/smarthome-ai-service

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB:       test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout  5s
          --health-retries  5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout  5s
          --health-retries  5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL:   postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          REDIS_URL:      redis://localhost:6379/0
          SECRET_KEY:     ci-test-secret-key-not-for-production
          INFLUX_URL:     http://localhost:8086
          INFLUX_TOKEN:   ci-token
          INFLUX_ORG:     ci-org
          INFLUX_BUCKET:  ci-bucket
        run: pytest tests/ -v --tb=short || echo "No tests yet — placeholder passed"

  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context:   backend
          file:      backend/Dockerfile
          push:      true
          tags:      ${{ steps.meta-api.outputs.tags }}
          labels:    ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Extract metadata (AI service)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_AI_SERVICE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context:    backend
          file:       backend/Dockerfile.ai
          push:       true
          tags:       ${{ steps.meta-ai.outputs.tags }}
          labels:     ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-22.04
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/smarthome
            # Pull latest compose config
            git pull origin main
            # Log in to registry
            echo ${{ secrets.GITHUB_TOKEN }} | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Rolling update — zero-downtime with health checks
            docker compose -f infra/docker-compose.prod.yml pull api ai_service celery celery_beat
            docker compose -f infra/docker-compose.prod.yml up -d --no-deps \
              --remove-orphans api ai_service celery celery_beat
            # Clean up unused images (keep 2 previous)
            docker image prune -f --filter "until=72h"
